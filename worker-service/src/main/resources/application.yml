server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: worker-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:emailprocessor}
    username: ${POSTGRES_USER:email}
    password: ${POSTGRES_PASSWORD:email}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      worker_id: ${WORKER_ID:${HOSTNAME:worker-1}}

app:
  # Prefer explicit WORKER_ID; fall back to container hostname so scaled replicas are unique consumers
  worker-id: ${WORKER_ID:${HOSTNAME:worker-1}}
  concurrency: ${WORKER_CONCURRENCY:4}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  streams:
    incoming: emails:incoming
    dlq: emails:dlq
    consumer-group: email-workers
  retry:
    max-retries: ${MAX_RETRIES:3}
    base-backoff-ms: ${BASE_BACKOFF_MS:500}
    max-backoff-ms: ${MAX_BACKOFF_MS:10000}
  recovery:
    min-idle-time-ms: ${MIN_IDLE_TIME_MS:60000}
    claim-interval-ms: ${CLAIM_INTERVAL_MS:15000}
    claim-batch-size: ${CLAIM_BATCH_SIZE:10}
  consumer:
    enabled: ${WORKER_CONSUMER_ENABLED:true}
    poll-batch-size: ${WORKER_POLL_BATCH_SIZE:10}
    block-ms: ${WORKER_BLOCK_MS:2000}

logging:
  level:
    root: INFO
    com.jesri.email: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level worker_id=%X{workerId} email_id=%X{emailId} cache_id=%X{cacheId} - %msg%n"
