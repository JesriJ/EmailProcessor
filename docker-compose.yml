services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emailprocessor}
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email} -d ${POSTGRES_DB:-emailprocessor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      CATEGORIES_FILE: /config/categories.lock
      CATEGORIES_FALLBACK_FILE: /config/categories.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-emailprocessor}
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      # Leave WORKER_ID unset so each replica uses its container hostname (unique consumer name)
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      BASE_BACKOFF_MS: ${BASE_BACKOFF_MS:-500}
      MAX_BACKOFF_MS: ${MAX_BACKOFF_MS:-10000}
      MIN_IDLE_TIME_MS: ${MIN_IDLE_TIME_MS:-60000}
      CLAIM_INTERVAL_MS: ${CLAIM_INTERVAL_MS:-15000}
      CLAIM_BATCH_SIZE: ${CLAIM_BATCH_SIZE:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    # Do not bind a fixed host port — --scale worker=N would collide on 8080.
    # Use the gateway service for http://localhost:8088/
    expose:
      - "8080"

  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - worker

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-emailprocessor}
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATASET_PATH: /data/samples/emails-100.jsonl
    volumes:
      - ./samples:/data/samples:ro
      - ./benchmark/datasets:/data/benchmark:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    profiles: ["producer"]

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-emailprocessor}
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MODE: ${MAIL_MODE:-gmail}
      USE_MOCK_GMAIL: ${USE_MOCK_GMAIL:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GMAIL_SYNC_MAX_MESSAGES: ${GMAIL_SYNC_MAX_MESSAGES:-50}
      GMAIL_SYNC_LOOKBACK_DAYS: ${GMAIL_SYNC_LOOKBACK_DAYS:-7}
      GMAIL_QUERY: ${GMAIL_QUERY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    profiles: ["ingest"]

volumes:
  pgdata:
